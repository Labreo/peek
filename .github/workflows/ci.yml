name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lockfile is written by npm 11; npm 10 (bundled with Node 22) rejects its optional platform entries.
      - run: npm install -g npm@11
      # Tests and the bundle need no Electron binary, native HID build or Presage key.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: bash scripts/prepublish-check.sh --ci
